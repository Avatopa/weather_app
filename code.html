<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skyline — Live Atmospheric Readout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold: #f2b705;
    --gold-dim: #c99a06;
    --ink: #eef2f6;
    --ink-dim: rgba(238,242,246,0.62);
    --ink-faint: rgba(238,242,246,0.38);
    --panel: rgba(255,255,255,0.08);
    --panel-border: rgba(255,255,255,0.16);
    --radius: 10px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .sky-layer{
    position:fixed; inset:0;
    z-index:0;
    transition: opacity 1.8s ease;
  }
  #skyA{ opacity:1; }
  #skyB{ opacity:0; }

  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  #sky-canvas{
    position:fixed; inset:0; z-index:1;
    display:block;
  }

  .app{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 8vh 20px 6vh;
  }

  .brand{ text-align:center; margin-bottom:38px; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:800;
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing:-0.02em;
    margin:0;
    line-height:1;
  }

  .tagline{
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink-dim);
    margin:10px 0 0;
    font-weight:400;
  }

  .search-row{
    display:flex;
    gap:10px;
    width:100%;
    max-width:440px;
    margin-bottom:14px;
  }

  #cityInput{
    flex:1;
    background: rgba(255,255,255,0.07);
    border:1px solid var(--panel-border);
    border-radius: var(--radius);
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  #cityInput::placeholder{ color:var(--ink-faint); }
  #cityInput:focus{
    border-color: var(--gold);
    background: rgba(255,255,255,0.1);
  }
  #cityInput:focus-visible{ outline: 2px solid var(--gold); outline-offset:2px; }

  #searchBtn{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background: var(--gold);
    color:#1a1406;
    border:none;
    border-radius: var(--radius);
    padding:0 20px;
    cursor:pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  #searchBtn:hover{ background: var(--gold-dim); }
  #searchBtn:active{ transform: scale(0.97); }
  #searchBtn:focus-visible{ outline: 2px solid var(--ink); outline-offset:2px; }
  #searchBtn[disabled]{ opacity:0.6; cursor:default; }

  .message{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color: #ffb4a3;
    min-height:18px;
    margin-bottom:6px;
    text-align:center;
  }

  .card{
    width:100%;
    max-width:440px;
    background: var(--panel);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border:1px solid var(--panel-border);
    border-radius: 14px;
    padding:28px 30px 24px;
    margin-top:18px;
    opacity:1;
    transform: translateY(0);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .card.hidden{
    opacity:0;
    transform: translateY(12px);
    pointer-events:none;
    position:absolute;
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:18px;
    border-bottom:1px solid var(--panel-border);
    margin-bottom:18px;
  }

  .place h2{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 4px;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  #coords{
    font-size:11px;
    color:var(--ink-faint);
    margin:0;
    letter-spacing:0.02em;
  }

  .condition-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(242,183,5,0.4);
    border-radius:100px;
    padding:5px 12px;
    white-space:nowrap;
  }

  .temp-display{
    display:flex;
    align-items:flex-start;
    gap:4px;
    margin-bottom:22px;
  }

  .temp-number{
    font-family:'Space Grotesk', sans-serif;
    font-weight:800;
    font-size:5.2rem;
    line-height:0.9;
    letter-spacing:-0.03em;
  }
  .temp-unit{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.6rem;
    margin-top:10px;
    color: var(--ink-dim);
  }

  .stats-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:14px;
  }

  .stat{
    display:flex;
    flex-direction:column;
    gap:6px;
    border-left:2px solid rgba(242,183,5,0.35);
    padding-left:10px;
  }

  .stat-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-faint);
  }

  .stat-value{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
  }

  footer{
    margin-top:auto;
    padding-top:40px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.05em;
    color: var(--ink-faint);
    text-align:center;
  }

  @media (max-width:480px){
    .temp-number{ font-size:4rem; }
    .stats-row{ gap:8px; }
    .stat{ padding-left:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .sky-layer{ transition:none; }
    .card{ transition:none; }
  }
</style>
</head>
<body>

  <div id="skyA" class="sky-layer"></div>
  <div id="skyB" class="sky-layer"></div>
  <canvas id="sky-canvas"></canvas>
  <div class="vignette"></div>

  <div class="app">
    <div class="brand">
      <span class="eyebrow">Live Atmospheric Readout</span>
      <h1>Skyline</h1>
      <p class="tagline">Search any city — the sky above reacts to what's really happening there.</p>
    </div>

    <div class="search-row">
      <input id="cityInput" type="text" placeholder="Search a city…" autocomplete="off" />
      <button id="searchBtn">Get Weather</button>
    </div>

    <div id="message" class="message" role="status"></div>

    <div id="card" class="card hidden">
      <div class="card-top">
        <div class="place">
          <h2 id="cityName">—</h2>
          <p id="coords" class="mono">—</p>
        </div>
        <div class="condition-badge" id="conditionBadge">—</div>
      </div>
      <div class="temp-display">
        <span id="temp" class="temp-number">--</span><span class="temp-unit">°C</span>
      </div>
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">WIND</span>
          <span class="stat-value mono" id="wind">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">HUMIDITY</span>
          <span class="stat-value mono" id="humidity">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">FEELS LIKE</span>
          <span class="stat-value mono" id="feels">--</span>
        </div>
      </div>
    </div>

    <footer>DATA · OPEN-METEO.COM &nbsp;·&nbsp; NO API KEY REQUIRED</footer>
  </div>

<script>
(function(){
  "use strict";

  // ---------------- reduced motion ----------------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------- sky gradient crossfade ----------------
  const GRADIENTS = {
    default: 'linear-gradient(180deg, #0B1220 0%, #1B2A4A 55%, #2D3E5F 100%)',
    sunny:   'linear-gradient(180deg, #2E86C1 0%, #6FB3E0 45%, #F4C860 100%)',
    cloudy:  'linear-gradient(180deg, #4B5768 0%, #7C8798 55%, #A9B4C0 100%)',
    rain:    'linear-gradient(180deg, #151E2B 0%, #263849 55%, #33495E 100%)',
    snow:    'linear-gradient(180deg, #3E4E5E 0%, #8FA7B8 55%, #E4EEF3 100%)',
    storm:   'linear-gradient(180deg, #0A0D13 0%, #171E29 55%, #232B38 100%)',
    fog:     'linear-gradient(180deg, #5B6472 0%, #8B93A0 55%, #C9CFD6 100%)'
  };

  const skyA = document.getElementById('skyA');
  const skyB = document.getElementById('skyB');
  let activeLayer = skyA, inactiveLayer = skyB;

  function setSkyGradient(state){
    const grad = GRADIENTS[state] || GRADIENTS.default;
    inactiveLayer.style.background = grad;
    // force reflow so the opacity transition fires
    void inactiveLayer.offsetWidth;
    inactiveLayer.style.opacity = '1';
    activeLayer.style.opacity = '0';
    const tmp = activeLayer;
    activeLayer = inactiveLayer;
    inactiveLayer = tmp;
  }
  skyA.style.background = GRADIENTS.default;

  // ---------------- canvas particle engine ----------------
  const canvas = document.getElementById('sky-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let currentState = 'default';
  let stars = [], clouds = [], raindrops = [], snowflakes = [], fogBands = [];
  let lightningAlpha = 0, lightningTimer = randRange(2000, 6000);

  function randRange(a,b){ return a + Math.random()*(b-a); }

  function makeStars(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({ x: Math.random()*W, y: Math.random()*H*0.7, r: randRange(0.6,1.8), phase: Math.random()*Math.PI*2, speed: randRange(0.01,0.03) });
    }
    return arr;
  }

  function makeClouds(n, opacityRange){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({
        x: Math.random()*W,
        y: randRange(H*0.08, H*0.42),
        scale: randRange(0.7, 1.6),
        speed: randRange(4, 14),
        opacity: randRange(opacityRange[0], opacityRange[1])
      });
    }
    return arr;
  }

  function makeRain(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({ x: Math.random()*W, y: Math.random()*H, len: randRange(14,28), speed: randRange(700,1100), opacity: randRange(0.25,0.55) });
    }
    return arr;
  }

  function makeSnow(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({ x: Math.random()*W, y: Math.random()*H, r: randRange(1.5,3.6), speed: randRange(25,65), drift: randRange(-20,20), phase: Math.random()*Math.PI*2 });
    }
    return arr;
  }

  function makeFog(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({ x: Math.random()*W, y: randRange(H*0.3,H*0.95), w: randRange(260,520), h: randRange(60,120), speed: randRange(6,16), opacity: randRange(0.08,0.18) });
    }
    return arr;
  }

  function drawCloud(c){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.fillStyle = `rgba(255,255,255,${c.opacity})`;
    ctx.beginPath();
    ctx.ellipse(0,0,55,26,0,0,Math.PI*2);
    ctx.ellipse(38,8,40,20,0,0,Math.PI*2);
    ctx.ellipse(-38,10,42,20,0,0,Math.PI*2);
    ctx.ellipse(10,-16,36,22,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawSun(){
    const cx = W*0.78, cy = H*0.22, t = Date.now()/1000;
    ctx.save();
    const glow = ctx.createRadialGradient(cx,cy,10,cx,cy,180);
    glow.addColorStop(0, 'rgba(255,236,170,0.9)');
    glow.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx,cy,180,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(255,236,170,0.35)';
    ctx.lineWidth = 2;
    for(let i=0;i<12;i++){
      const a = (i/12)*Math.PI*2 + t*0.05;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*70, cy + Math.sin(a)*70);
      ctx.lineTo(cx + Math.cos(a)*105, cy + Math.sin(a)*105);
      ctx.stroke();
    }
    ctx.fillStyle = '#FFF3D2';
    ctx.beginPath(); ctx.arc(cx,cy,52,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function reinitParticles(state){
    stars = state === 'default' ? makeStars(90) : [];
    if(state === 'sunny') clouds = makeClouds(2, [0.5,0.75]);
    else if(state === 'cloudy') clouds = makeClouds(7, [0.7,0.95]);
    else if(state === 'rain' || state === 'storm') clouds = makeClouds(6, [0.55,0.85]);
    else if(state === 'snow') clouds = makeClouds(4, [0.6,0.85]);
    else if(state === 'default') clouds = makeClouds(2, [0.15,0.25]);
    else clouds = [];

    raindrops = (state === 'rain' || state === 'storm') ? makeRain(state === 'storm' ? 220 : 160) : [];
    snowflakes = state === 'snow' ? makeSnow(140) : [];
    fogBands = state === 'fog' ? makeFog(9) : [];
    lightningAlpha = 0;
    lightningTimer = randRange(1500, 4500);
  }

  reinitParticles('default');

  let lastTime = performance.now();

  function frame(now){
    const dt = Math.min((now - lastTime)/1000, 0.05);
    lastTime = now;

    ctx.clearRect(0,0,W,H);

    if(currentState === 'sunny'){
      drawSun();
    }

    // stars (default/night)
    if(stars.length){
      const t = now/1000;
      stars.forEach(s=>{
        const tw = 0.5 + 0.5*Math.sin(t*2 + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${0.25 + tw*0.6})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      });
    }

    // clouds
    clouds.forEach(c=>{
      c.x += c.speed*dt;
      if(c.x - 140*c.scale > W) c.x = -140*c.scale;
      drawCloud(c);
    });

    // rain
    if(raindrops.length){
      ctx.strokeStyle = 'rgba(190,220,255,0.55)';
      ctx.lineWidth = 1.4;
      raindrops.forEach(r=>{
        r.y += r.speed*dt;
        r.x -= 60*dt;
        if(r.y > H){ r.y = -20; r.x = Math.random()*W; }
        ctx.globalAlpha = r.opacity;
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 6, r.y + r.len);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // snow
    if(snowflakes.length){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      snowflakes.forEach(s=>{
        s.y += s.speed*dt;
        s.x += Math.sin(now/1000 + s.phase) * 0.6;
        if(s.y > H){ s.y = -10; s.x = Math.random()*W; }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      });
    }

    // fog bands
    if(fogBands.length){
      fogBands.forEach(f=>{
        f.x += f.speed*dt;
        if(f.x - f.w > W) f.x = -f.w;
        const grad = ctx.createLinearGradient(f.x - f.w/2, 0, f.x + f.w/2, 0);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.5, `rgba(255,255,255,${f.opacity})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y, f.w/2, f.h/2, 0, 0, Math.PI*2);
        ctx.fill();
      });
    }

    // lightning
    if(currentState === 'storm'){
      lightningTimer -= dt*1000;
      if(lightningTimer <= 0){
        lightningAlpha = 1;
        lightningTimer = randRange(2500, 7000);
      }
      if(lightningAlpha > 0){
        ctx.fillStyle = `rgba(255,255,255,${lightningAlpha*0.55})`;
        ctx.fillRect(0,0,W,H);
        lightningAlpha -= dt*2.2;
        if(lightningAlpha < 0) lightningAlpha = 0;
      }
    }

    requestAnimationFrame(frame);
  }

  if(!reduceMotion){
    requestAnimationFrame(frame);
  } else {
    // draw a single static frame
    reinitParticles('default');
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });
  }

  function setState(state){
    if(state === currentState) return;
    currentState = state;
    setSkyGradient(state);
    reinitParticles(state);
  }

  // ---------------- weather code mapping (WMO) ----------------
  function mapWeatherCode(code){
    if(code === 0) return { label: 'Clear sky', state: 'sunny' };
    if(code === 1) return { label: 'Mostly clear', state: 'sunny' };
    if(code === 2) return { label: 'Partly cloudy', state: 'cloudy' };
    if(code === 3) return { label: 'Overcast', state: 'cloudy' };
    if(code === 45 || code === 48) return { label: 'Fog', state: 'fog' };
    if(code >= 51 && code <= 57) return { label: 'Drizzle', state: 'rain' };
    if(code >= 61 && code <= 67) return { label: 'Rain', state: 'rain' };
    if(code >= 80 && code <= 82) return { label: 'Rain showers', state: 'rain' };
    if(code >= 71 && code <= 77) return { label: 'Snow', state: 'snow' };
    if(code === 85 || code === 86) return { label: 'Snow showers', state: 'snow' };
    if(code >= 95 && code <= 99) return { label: 'Thunderstorm', state: 'storm' };
    return { label: 'Unsettled', state: 'cloudy' };
  }

  // ---------------- DOM refs ----------------
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const messageEl = document.getElementById('message');
  const card = document.getElementById('card');
  const cityNameEl = document.getElementById('cityName');
  const coordsEl = document.getElementById('coords');
  const conditionBadge = document.getElementById('conditionBadge');
  const tempEl = document.getElementById('temp');
  const windEl = document.getElementById('wind');
  const humidityEl = document.getElementById('humidity');
  const feelsEl = document.getElementById('feels');

  async function getWeather(){
    const city = cityInput.value.trim();
    messageEl.textContent = '';

    if(!city){
      messageEl.textContent = 'Type a city name first.';
      return;
    }

    searchBtn.disabled = true;
    searchBtn.textContent = 'Loading…';

    try{
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
      const geoData = await geoRes.json();

      if(!geoData.results || geoData.results.length === 0){
        messageEl.textContent = 'City not found.';
        card.classList.add('hidden');
        searchBtn.disabled = false;
        searchBtn.textContent = 'Get Weather';
        return;
      }

      const place = geoData.results[0];
      const { latitude, longitude, name, country, admin1 } = place;

      const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto`);
      const wData = await wRes.json();
      const current = wData.current;

      const condition = mapWeatherCode(current.weather_code);

      cityNameEl.textContent = `${name}${admin1 ? ', ' + admin1 : ''}`;
      coordsEl.textContent = `${latitude.toFixed(2)}°, ${longitude.toFixed(2)}° · ${country || ''}`;
      conditionBadge.textContent = condition.label;
      tempEl.textContent = Math.round(current.temperature_2m);
      windEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      humidityEl.textContent = `${Math.round(current.relative_humidity_2m)}%`;
      feelsEl.textContent = `${Math.round(current.apparent_temperature)}°C`;

      card.classList.remove('hidden');
      setState(condition.state);

    }catch(err){
      if(location.protocol === 'file:'){
        messageEl.textContent = 'Network request blocked — open this file through a local server (not by double-clicking) or a real URL.';
      } else {
        messageEl.textContent = `Request failed: ${err.message}`;
      }
      console.error(err);
    }finally{
      searchBtn.disabled = false;
      searchBtn.textContent = 'Get Weather';
    }
  }

  searchBtn.addEventListener('click', getWeather);
  cityInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') getWeather();
  });

})();
</script>
</body>
</html>
